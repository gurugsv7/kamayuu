<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <title>Kamayuu — link cover</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cinzel"; src: url("assets/fonts/Cinzel-700.woff2") format("woff2"); font-weight: 600 700; font-style: normal; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/CormorantGaramond-600.woff2") format("woff2"); font-weight: 400 600; font-style: normal; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/CormorantGaramond-600i.woff2") format("woff2"); font-weight: 400 600; font-style: italic; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0e14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b0e14; color: #f5e6cb; font-family: "Cinzel", Georgia, serif; }

      .felt { position: absolute; inset: 0; background: #0b0e14 url("assets/img/table.webp") center / cover no-repeat; }
      .felt-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 40% 45%, #1a232c99 0%, #0a0e1399 45%, #05080bee 100%); }
      #glow { position: absolute; left: -200px; top: -240px; width: 820px; height: 820px; border-radius: 50%; background: radial-gradient(circle, #e0a94a55 0%, #c9873320 38%, transparent 70%); }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 38% 50%, transparent 30%, #05080bcc 92%); }

      /* A thin brass frame, the same device the table uses. */
      #frame { position: absolute; inset: 22px; border: 1px solid #a07a3a66; }
      #frame:after { content: ""; position: absolute; inset: 7px; border: 1px solid #a07a3a2e; }

      /* Left column holds the name; the cards sit off the right edge. */
      #wm { position: absolute; left: 86px; top: 236px; font: 700 104px/1 "Cinzel", Georgia, serif; letter-spacing: 0.09em; color: #f7ead2; text-shadow: 0 0 60px #e0a94a3d, 0 8px 30px #000c; }
      #tag { position: absolute; left: 92px; top: 366px; font: italic 500 40px/1 "Cormorant Garamond", Georgia, serif; color: #e1c9a3; }
      #kicker { position: absolute; left: 92px; top: 168px; font: 600 20px/1 "Cinzel", Georgia, serif; letter-spacing: 0.3em; color: #c6b494; }
      #rule { position: absolute; left: 92px; top: 432px; width: 420px; height: 2px; background: linear-gradient(90deg, #e6c17a, #a07a3a 55%, transparent); opacity: 0.6; }
      #addr { position: absolute; left: 92px; top: 468px; font: 600 24px/1 "Cinzel", Georgia, serif; letter-spacing: 0.2em; color: #e1b56b; }

      .card { position: absolute; width: 208px; height: 291px; border-radius: 12px; overflow: hidden; box-shadow: 0 22px 44px #000c, 0 0 0 1px #c8a46944; }
      .card img { display: block; width: 100%; height: 100%; }
      .card.back { background: #0c1e30 url("assets/img/cards/back.png") center / 100% 100% no-repeat; }
      .card.front { background: #f7ead2; }
      #c1 { left: 742px; top: 74px; transform: rotate(-7deg); }
      #c2 { left: 950px; top: 132px; transform: rotate(4deg); z-index: 2; }
      #c3 { left: 812px; top: 300px; transform: rotate(9deg); }
      .zero { position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%); font: 700 15px/1 "Cinzel", Georgia, serif; letter-spacing: 0.1em; color: #ffe1a1; background: #101b26e0; border: 1px solid #c8a46988; border-radius: 3px; padding: 5px 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="og" data-width="1200" data-height="630" data-duration="1">
      <div class="felt"></div>
      <div class="felt-shade"></div>
      <div id="glow"></div>
      <div id="vig"></div>
      <div id="frame"></div>

      <div class="card back" id="c1"></div>
      <div class="card front" id="c2"><img src="assets/img/cards/KD.svg" alt="" /><span class="zero">ZERO</span></div>
      <div class="card back" id="c3"></div>

      <div id="kicker">REMEMBER · OBSERVE · OUTTHINK</div>
      <div id="wm">KAMAYUU</div>
      <div id="tag">A Game of Memory &amp; Nerve</div>
      <div id="rule"></div>
      <div id="addr">KAMAYUU.BUILTBYGSV.IN</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1 });
      window.__timelines = window.__timelines || {};
      window.__timelines["og"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
