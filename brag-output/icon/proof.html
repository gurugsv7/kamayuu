<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kamayuu icon proof</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1000px; height: 400px; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; background: #fff; font: 13px system-ui, sans-serif; color: #333; }
      .band { position: absolute; left: 0; right: 0; height: 200px; display: flex; align-items: center; gap: 46px; padding: 0 40px; }
      #light { top: 0; background: #fff; color: #444; }
      #dark { top: 200px; background: #1f1f1f; color: #ddd; }
      .s { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .s img { display: block; image-rendering: auto; }
      .s span { font: 11px system-ui, sans-serif; }
      .tab { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 9px 9px 0 0; background: #e8e8e8; color: #222; font: 12px system-ui, sans-serif; }
      #dark .tab { background: #333; color: #eee; }
      .serp { display: flex; align-items: center; gap: 9px; }
      .serp .txt b { display: block; font: 12px system-ui, sans-serif; }
      .serp .txt i { font-style: normal; font: 10px system-ui, sans-serif; opacity: .7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="icon" data-width="1000" data-height="400" data-duration="1">
      <div class="band" id="light">
        <div class="s"><img src="mark.svg" width="16" height="16" alt=""/><span>16</span></div>
        <div class="s"><img src="mark.svg" width="24" height="24" alt=""/><span>24</span></div>
        <div class="s"><img src="mark.svg" width="32" height="32" alt=""/><span>32</span></div>
        <div class="s"><img src="mark.svg" width="64" height="64" alt=""/><span>64</span></div>
        <div class="tab"><img src="mark.svg" width="16" height="16" alt=""/>Kamayuu — A Game of…</div>
        <div class="serp"><img src="mark.svg" width="28" height="28" alt=""/><div class="txt"><b>Kamayuu</b><i>kamayuu.builtbygsv.in</i></div></div>
      </div>
      <div class="band" id="dark">
        <div class="s"><img src="mark.svg" width="16" height="16" alt=""/><span>16</span></div>
        <div class="s"><img src="mark.svg" width="24" height="24" alt=""/><span>24</span></div>
        <div class="s"><img src="mark.svg" width="32" height="32" alt=""/><span>32</span></div>
        <div class="s"><img src="mark.svg" width="64" height="64" alt=""/><span>64</span></div>
        <div class="tab"><img src="mark.svg" width="16" height="16" alt=""/>Kamayuu — A Game of…</div>
        <div class="serp"><img src="mark.svg" width="28" height="28" alt=""/><div class="txt"><b>Kamayuu</b><i>kamayuu.builtbygsv.in</i></div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1 });
      window.__timelines = window.__timelines || {};
      window.__timelines["icon"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
