<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>mark</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>*{margin:0;padding:0}html,body{width:512px;height:512px;background:transparent}
  #root{width:100%;height:100%;background:transparent}
  #root img{display:block;width:512px;height:512px}</style></head>
  <body>
    <div id="root" data-composition-id="mark" data-width="512" data-height="512" data-duration="1">
      <img src="mark.svg" alt="" />
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1 });
      window.__timelines = window.__timelines || {};
      window.__timelines["mark"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
